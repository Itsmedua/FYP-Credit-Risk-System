
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Officer Password</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1f2937;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            box-sizing: border-box;
            border-radius: 6px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            background: #166534;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Reset Officer Password</h2>

    <p>Enter your new password below.</p>

    <form id="resetForm">
        <input
            type="password"
            id="newPassword"
            placeholder="New password"
            minlength="8"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="8"
            required
        >

        <button type="submit">Update Password</button>
    </form>

    <div id="message"></div>
</div>

<script>
    const SUPABASE_URL = "https://guuiwgxqyvhmvlbtyjoo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_2Gr-O7dxre1hYgiE09OkYg_uYOazDM7";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                detectSessionInUrl: false
            }
        }
    );

    const message = document.getElementById("message");
    const form = document.getElementById("resetForm");

    async function verifyRecoverySession() {
        try {
            const params = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(
                window.location.hash.substring(1)
            );

            const errorDescription =
                hashParams.get("error_description") ||
                params.get("error_description");

            if (errorDescription) {
                throw new Error(errorDescription);
            }

            const code = params.get("code");

            if (code) {
                const { error } =
                    await supabaseClient.auth.exchangeCodeForSession(code);

                if (error) throw error;

            } else {
                const access_token = hashParams.get("access_token");
                const refresh_token = hashParams.get("refresh_token");

                if (!access_token || !refresh_token) {
                    throw new Error(
                        "Invalid or expired recovery link. Request a new password reset email."
                    );
                }

                const { error } = await supabaseClient.auth.setSession({
                    access_token,
                    refresh_token
                });

                if (error) throw error;
            }

            message.style.color = "green";
            message.textContent = "Recovery link verified. Set your new password.";

            history.replaceState(null, "", window.location.pathname);

        } catch (error) {
            form.style.display = "none";
            message.style.color = "red";
            message.textContent = error.message;
        }
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const password = document.getElementById("newPassword").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password.length < 8) {
            message.style.color = "red";
            message.textContent = "Password must contain at least 8 characters.";
            return;
        }

        if (password !== confirmPassword) {
            message.style.color = "red";
            message.textContent = "Passwords do not match.";
            return;
        }

        const { error } = await supabaseClient.auth.updateUser({
            password: password
        });

        if (error) {
            message.style.color = "red";
            message.textContent = error.message;
        } else {
            message.style.color = "green";
            message.textContent =
                "Password updated successfully! You can now log in to your FYP application.";
            form.style.display = "none";
        }
    });

    verifyRecoverySession();
</script>

</body>
</html>
